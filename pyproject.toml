[project]
name = "j2-forecast"
version = "0.1.0"
requires-python = ">= 3.14.7"
dependencies = [
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]   # så tests kan skrive "from model import ..."
